# Pensado para desplegarse como servicio "Docker Compose" en Dokploy.
# El dominio/HTTPS normalmente se configuran desde el panel de Dokploy
# (Traefik); el mapeo de "ports" de abajo sirve sobre todo para probar
# localmente con `docker compose up`.
services:
  manicura-backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/manicura.db
    volumes:
      - manicura_data:/app/data
    ports:
      - "3000:3000"

volumes:
  manicura_data:
